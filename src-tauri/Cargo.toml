[package]
name = "tiddl-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI front-end for the tiddl CLI. Bundles no tiddl code."

[lib]
name = "tiddl_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml_edit = "0.22"
# Read-only HTTPS client for listing the user's own favorites (no
# downloading / DRM). Reuses the token tiddl already stored.
ureq = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Keep target/debug/deps from ballooning: trim third-party debuginfo.
[profile.dev.package."*"]
debug = "line-tables-only"
